# =====================================================
# 不期周末管理后台 - 应用配置
# =====================================================

server:
  port: 8080

spring:
  application:
    name: blind-weekend-manager

  # ---------- 数据源配置 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blind_weekend?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Cs2736495328
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ---------- Redis配置 ----------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
      timeout: 10000ms

  # ---------- 文件上传配置 ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ---------- JSON序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

# ---------- MyBatis Plus配置 ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.blindweekend.manager.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 注意：当前数据库表无 deleted 列，暂不启用逻辑删除
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

# ---------- PageHelper分页配置 ----------
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# ---------- 日志配置 ----------
logging:
  level:
    root: info
    com.blindweekend: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/blind-weekend-manager.log

# ---------- 自定义应用配置 ----------
app:
  # 文件上传存储路径
  upload:
    path: ./uploads/
    # 文件访问URL前缀（局域网访问时改为本机IP）
    access-url: http://10.213.212.236:8080/files/

  # JWT 认证配置
  jwt:
    # JWT签名密钥（生产环境必须更换为复杂的随机字符串，至少256位）
    secret: blind-weekend-manager-secret-key-for-jwt-signing-production-replace-this
    # Token有效期（毫秒），24小时 = 86400000ms
    expiration: 86400000
