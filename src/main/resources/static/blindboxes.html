<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盲盒管理 - 不期周末管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🏷️</span><span>不期周末</span></div>
    <nav class="sidebar-nav">
      <a data-page="dashboard" href="/"><span class="nav-icon">📊</span><span class="nav-text">数据概览</span></a>
      <a data-page="users" href="/users.html"><span class="nav-icon">👤</span><span class="nav-text">用户管理</span></a>
      <a data-page="spots" href="/spots.html"><span class="nav-icon">📍</span><span class="nav-text">活动地点</span></a>
      <a data-page="templates" href="/templates.html"><span class="nav-icon">📋</span><span class="nav-text">方案模板</span></a>
      <a data-page="blindboxes" href="/blindboxes.html"><span class="nav-icon">🎁</span><span class="nav-text">盲盒管理</span></a>
      <a data-page="reviews" href="/reviews.html"><span class="nav-icon">💬</span><span class="nav-text">评论与签到</span></a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title">🎁 盲盒管理</span>
      <div class="topbar-right">
        <span class="admin-info" id="adminName">管理员</span>
        <button class="btn-logout" onclick="logout()">退出</button>
      </div>
    </header>

    <main class="page-body">
      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search-input" id="boxKeyword" placeholder="搜索标题..." onkeydown="if(event.key==='Enter')loadBlindBoxes(1)">
        <select id="boxStatusFilter" onchange="loadBlindBoxes(1)">
          <option value="">全部状态</option>
          <option value="open">招募中</option>
          <option value="full">已满员</option>
          <option value="closed">已关闭</option>
          <option value="cancelled">已取消</option>
        </select>
        <button class="btn btn-primary" onclick="loadBlindBoxes(1)">🔍 搜索</button>
      </div>

      <!-- Stats -->
      <div class="stat-cards" id="boxStatsRow" style="margin-bottom:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
        <div class="stat-card"><div class="stat-card-icon blue">🎁</div><div class="stat-card-info"><h3 id="boxStatTotal">-</h3><p>总数</p></div></div>
        <div class="stat-card"><div class="stat-card-icon green">🔓</div><div class="stat-card-info"><h3 id="boxStatOpen">-</h3><p>招募中</p></div></div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>地区</th>
              <th>活动日期</th>
              <th>人数</th>
              <th>状态</th>
              <th>浏览量</th>
              <th>发布时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="boxTableBody">
            <tr><td colspan="9" class="empty-state"><span class="empty-icon">⏳</span>加载中...</td></tr>
          </tbody>
        </table>
        <div class="pagination-wrap" id="boxPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="boxDetailModal">
  <div class="modal-box wide">
    <div class="modal-header">
      <h3>盲盒详情</h3>
      <button class="modal-close" onclick="closeModal('boxDetailModal')">&times;</button>
    </div>
    <div class="modal-body" id="boxDetailContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('boxDetailModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 状态变更 Modal -->
<div class="modal-overlay" id="boxStatusModal">
  <div class="modal-box" style="max-width:420px">
    <div class="modal-header">
      <h3>修改盲盒状态</h3>
      <button class="modal-close" onclick="closeModal('boxStatusModal')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:#555;margin-bottom:12px">选择新状态：</p>
      <select class="form-control" id="newBoxStatus" style="width:100%">
        <option value="open">招募中</option>
        <option value="full">已满员</option>
        <option value="closed">已关闭</option>
        <option value="cancelled">已取消</option>
      </select>
      <input type="hidden" id="boxStatusId">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('boxStatusModal')">取消</button>
      <button class="btn btn-primary" onclick="updateBoxStatus()">确认修改</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/blindboxes.js"></script>
</body>
</html>
