<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论与签到 - 不期周末管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🏷️</span><span>不期周末</span></div>
    <nav class="sidebar-nav">
      <a data-page="dashboard" href="/"><span class="nav-icon">📊</span><span class="nav-text">数据概览</span></a>
      <a data-page="users" href="/users.html"><span class="nav-icon">👤</span><span class="nav-text">用户管理</span></a>
      <a data-page="spots" href="/spots.html"><span class="nav-icon">📍</span><span class="nav-text">活动地点</span></a>
      <a data-page="templates" href="/templates.html"><span class="nav-icon">📋</span><span class="nav-text">方案模板</span></a>
      <a data-page="blindboxes" href="/blindboxes.html"><span class="nav-icon">🎁</span><span class="nav-text">盲盒管理</span></a>
      <a data-page="reviews" href="/reviews.html"><span class="nav-icon">💬</span><span class="nav-text">评论与签到</span></a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title">💬 评论与签到</span>
      <div class="topbar-right">
        <span class="admin-info" id="adminName">管理员</span>
        <button class="btn-logout" onclick="logout()">退出</button>
      </div>
    </header>

    <main class="page-body">
      <!-- Tabs -->
      <div class="tabs" id="reviewTabs">
        <div class="tab-item active" data-tab="checkinTab" onclick="switchReviewTab('checkinTab', this)">📸 签到记录</div>
        <div class="tab-item" data-tab="reviewTab" onclick="switchReviewTab('reviewTab', this)">💬 评论管理</div>
      </div>

      <!-- 签到记录 Tab -->
      <div class="tab-pane active" id="checkinTab">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>用户ID</th>
                <th>目标类型</th>
                <th>目标ID</th>
                <th>评分</th>
                <th>照片数</th>
                <th>短评</th>
                <th>签到时间</th>
              </tr>
            </thead>
            <tbody id="checkinTableBody">
              <tr><td colspan="8" class="empty-state"><span class="empty-icon">⏳</span>加载中...</td></tr>
            </tbody>
          </table>
          <div class="pagination-wrap" id="checkinPagination"></div>
        </div>
      </div>

      <!-- 评论管理 Tab -->
      <div class="tab-pane" id="reviewTab">
        <!-- Toolbar -->
        <div class="toolbar">
          <select id="reviewStatusFilter" onchange="loadReviews(1)">
            <option value="">全部状态</option>
            <option value="1">正常显示</option>
            <option value="0">已隐藏</option>
          </select>
          <button class="btn btn-primary" onclick="loadReviews(1)">🔍 刷新</button>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>地点ID</th>
                <th>内容</th>
                <th>评分</th>
                <th>状态</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reviewTableBody">
              <tr><td colspan="7" class="empty-state"><span class="empty-icon">⏳</span>加载中...</td></tr>
            </tbody>
          </table>
          <div class="pagination-wrap" id="reviewPagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/reviews.js"></script>
</body>
</html>
