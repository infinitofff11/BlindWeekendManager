<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 不期周末管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🏷️</span><span>不期周末</span></div>
    <nav class="sidebar-nav">
      <a data-page="dashboard" href="/"><span class="nav-icon">📊</span><span class="nav-text">数据概览</span></a>
      <a data-page="users" href="/users.html"><span class="nav-icon">👤</span><span class="nav-text">用户管理</span></a>
      <a data-page="spots" href="/spots.html"><span class="nav-icon">📍</span><span class="nav-text">活动地点</span></a>
      <a data-page="templates" href="/templates.html"><span class="nav-icon">📋</span><span class="nav-text">方案模板</span></a>
      <a data-page="blindboxes" href="/blindboxes.html"><span class="nav-icon">🎁</span><span class="nav-text">盲盒管理</span></a>
      <a data-page="reviews" href="/reviews.html"><span class="nav-icon">💬</span><span class="nav-text">评论与签到</span></a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title">👤 用户管理</span>
      <div class="topbar-right">
        <span class="admin-info">管理员</span>
      </div>
    </header>

    <main class="page-body">
      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search-input" id="searchKeyword" placeholder="搜索昵称或手机号..." onkeydown="if(event.key==='Enter')loadUsers(1)">
        <select id="filterStatus" onchange="loadUsers(1)">
          <option value="">全部状态</option>
          <option value="1">正常</option>
          <option value="0">已禁用</option>
        </select>
        <button class="btn btn-primary" onclick="loadUsers(1)">🔍 搜索</button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>昵称</th>
              <th>手机号</th>
              <th>城市</th>
              <th>状态</th>
              <th>注册时间</th>
              <th>最后登录</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="8" class="empty-state"><span class="empty-icon">⏳</span>加载中...</td></tr>
          </tbody>
        </table>
        <div class="pagination-wrap" id="userPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="userDetailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>用户详情</h3>
      <button class="modal-close" onclick="closeModal('userDetailModal')">&times;</button>
    </div>
    <div class="modal-body" id="userDetailContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userDetailModal')">关闭</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
